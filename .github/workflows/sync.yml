    runs-on: ubuntu-latest
    steps:
      - name: Sync top_rated
        run: |
          curl -X POST "https://xlfchtwebtehpuiaqush.supabase.co/functions/v1/sync_tmdb?source=top_rated" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --max-time 140 -w "\nHTTP Status: %{http_code}\n"

  sync-upcoming:
