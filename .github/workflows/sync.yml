name: Daily TMDB Sync

on:
  schedule:
    - cron: "50 1 * * *" # curated sources, sekali sehari jam 08.50 WIB
    - cron: "0 */4 * * *" # discover + cinema, tiap 4 jam → 6x sehari
  workflow_dispatch:

jobs:
  # ── Curated sources (sekali sehari jam 08.50 WIB) ──────────────────────────
  sync-trending:
    if: github.event.schedule == '50 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sync trending
        run: |
          curl -X POST "https://xlfchtwebtehpuiaqush.supabase.co/functions/v1/sync_tmdb?source=trending" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --max-time 140 -w "\nHTTP Status: %{http_code}\n"

  sync-popular:
    if: github.event.schedule == '50 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sync popular
        run: |
          curl -X POST "https://xlfchtwebtehpuiaqush.supabase.co/functions/v1/sync_tmdb?source=popular" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --max-time 140 -w "\nHTTP Status: %{http_code}\n"

  sync-top-rated:
