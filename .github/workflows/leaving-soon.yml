name: Daily Leaving Soon Sync

on:
  schedule:
    # Streaming: jam 06.00 WIB (23:00 UTC sehari sebelumnya)
    # Jalankan setelah sync_tmdb selesai agar movies/tv_series sudah fresh
    - cron: "0 23 * * *"

    # Cinema: jam 07.00 WIB (00:00 UTC) — setelah scraper cinema selesai
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - streaming
          - cinema
      platform:
        description: "Platform filter for streaming (netflix/disney+/prime/hbo-go/apple-tv)"
        required: false
        default: ""
      threshold_days:
        description: "Cinema threshold days (default: 7)"
        required: false
        default: "7"
      dry_run:
        description: "Dry run (log only, no DB writes)"
        required: false
        default: false
        type: boolean

jobs:
  # ── Streaming: Fetch expiring content dari Streaming Availability API ────────
  sync-leaving-soon-streaming:
    if: >
      github.event.schedule == '0 23 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'streaming'))
    runs-on: ubuntu-latest
    steps:
      - name: Sync leaving soon (streaming)
        run: |
          PLATFORM="${{ github.event.inputs.platform || '' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          QUERY="dry_run=${DRY_RUN}"
          if [ -n "$PLATFORM" ]; then
            QUERY="${QUERY}&platform=${PLATFORM}"
          fi

          curl -s -X POST \
            "https://xlfchtwebtehpuiaqush.supabase.co/functions/v1/sync-leaving-soon-streaming?${QUERY}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 280 \
            -w "\nHTTP Status: %{http_code}\n"

  # ── Cinema: Derive leaving soon dari showtimes ────────────────────────────────
  sync-leaving-soon-cinema:
    if: >
      github.event.schedule == '0 0 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'all' || github.event.inputs.job == 'cinema'))
    runs-on: ubuntu-latest
    steps:
      - name: Sync leaving soon (cinema)
        run: |
          THRESHOLD="${{ github.event.inputs.threshold_days || '7' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          curl -s -X POST \
            "https://xlfchtwebtehpuiaqush.supabase.co/functions/v1/sync-leaving-soon-cinema?threshold_days=${THRESHOLD}&dry_run=${DRY_RUN}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -w "\nHTTP Status: %{http_code}\n"
