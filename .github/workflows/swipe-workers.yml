# .github/workflows/swipe-workers.yml
#
# GitHub Actions untuk menjalankan Supabase Edge Function workers secara terjadwal.
#
# Schedule:
#   refresh-guest-pool        → setiap hari    pukul 00:00 UTC
#   process-reco-jobs         → setiap 12 jam  (00:00 & 12:00 UTC)
#   reset-daily-challenges    → setiap hari    pukul 17:00 UTC (00:00 WIB)
#   reset-weekly-challenges   → setiap Senin   pukul 17:00 UTC (00:00 WIB)
#
# Manual trigger tersedia untuk semua worker via workflow_dispatch.
#
# Secrets yang harus diset di GitHub → Settings → Secrets and variables → Actions:
#   SUPABASE_SERVICE_ROLE_KEY  → sudah ada dari workflow tmdb-sync.yml

name: Swipe Pick Workers

on:
  schedule:
    # Guest pool refresh — setiap hari 00:00 UTC
    - cron: "0 0 * * *"
    # Reco jobs processor — setiap 12 jam
    - cron: "0 0,12 * * *"
    # Daily + weekly challenge cleanup — setiap hari 17:00 UTC (00:00 WIB)
    # Weekly hanya akan dieksekusi jika hari Senin (dicek di dalam job)
    - cron: "0 17 * * *"

  # Trigger manual dari GitHub Actions UI
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to run"
        required: true
        type: choice
        options:
          - all
          - refresh-guest-pool
          - process-reco-jobs
          - generate-user-pool
          - reset-daily-challenges
          - reset-weekly-challenges
      userId:
        description: "User ID (hanya untuk generate-user-pool)"
        required: false
        type: string

env:
  SUPABASE_URL: https://xlfchtwebtehpuiaqush.supabase.co

# ─── Jobs ─────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Refresh guest pool ──────────────────────────────────────────────────
  refresh-guest-pool:
    name: Refresh Guest Pool
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'schedule' && (
        startsWith(github.event.schedule, '0 0 *')
      )) ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.worker == 'all' ||
        github.event.inputs.worker == 'refresh-guest-pool'
      ))

    steps:
      - name: Invoke refresh-guest-pool
        run: |
          echo "Calling refresh-guest-pool..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ env.SUPABASE_URL }}/functions/v1/refresh-guest-pool" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_CODE"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker failed with status $HTTP_CODE"
            exit 1
          fi

          INSERTED=$(echo "$HTTP_BODY" | grep -o '"inserted":[0-9]*' | grep -o '[0-9]*')
          echo "✅ Guest pool refreshed. Inserted: $INSERTED items"

  # ── 2. Process recommendation jobs ────────────────────────────────────────
  process-reco-jobs:
    name: Process Recommendation Jobs
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.worker == 'all' ||
        github.event.inputs.worker == 'process-reco-jobs'
      ))

    steps:
      - name: Invoke process-reco-jobs
        run: |
          echo "Calling process-reco-jobs..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ env.SUPABASE_URL }}/functions/v1/process-reco-jobs" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_CODE"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker failed with status $HTTP_CODE"
            exit 1
          fi

          PROCESSED=$(echo "$HTTP_BODY" | grep -o '"processed":[0-9]*' | grep -o '[0-9]*' || echo "0")
          DONE=$(echo "$HTTP_BODY"      | grep -o '"done":[0-9]*'      | grep -o '[0-9]*' || echo "0")
          FAILED=$(echo "$HTTP_BODY"    | grep -o '"failed":[0-9]*'    | grep -o '[0-9]*' | head -1 || echo "0")

          echo "✅ Jobs processed: $PROCESSED (done: $DONE, failed: $FAILED)"

          if [ "${FAILED:-0}" -gt "0" ]; then
            echo "⚠️ $FAILED job(s) failed during processing"
            exit 1
          fi

  # ── 3. Generate user pool (manual only) ───────────────────────────────────
  generate-user-pool:
    name: Generate User Pool (Manual)
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.worker == 'generate-user-pool' &&
      github.event.inputs.userId != ''

    steps:
      - name: Invoke generate-user-pool
        run: |
          USER_ID="${{ github.event.inputs.userId }}"
          echo "Calling generate-user-pool for user: $USER_ID"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ env.SUPABASE_URL }}/functions/v1/generate-user-pool" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"userId\": \"$USER_ID\"}")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_CODE"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker failed with status $HTTP_CODE"
            exit 1
          fi

          INSERTED=$(echo "$HTTP_BODY" | grep -o '"inserted":[0-9]*' | grep -o '[0-9]*')
          echo "✅ User pool generated. Inserted: $INSERTED items"

  # ── 4. Reset daily challenges cleanup ─────────────────────────────────────
  reset-daily-challenges:
    name: Reset Daily Challenges Cleanup
    runs-on: ubuntu-latest

    # Jalan setiap hari jam 17:00 UTC (schedule '0 17 * * *')
    if: |
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 17 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.worker == 'all' ||
        github.event.inputs.worker == 'reset-daily-challenges'
      ))

    steps:
      - name: Invoke reset-daily-challenges
        run: |
          echo "Calling reset-daily-challenges..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ env.SUPABASE_URL }}/functions/v1/reset-daily-challenges" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_CODE"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker failed with status $HTTP_CODE"
            exit 1
          fi

          DELETED=$(echo "$HTTP_BODY" | grep -o '"deleted":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "✅ Daily challenges cleanup done. Deleted: $DELETED old rows"

  # ── 5. Reset weekly challenges cleanup ────────────────────────────────────
  reset-weekly-challenges:
    name: Reset Weekly Challenges Cleanup
    runs-on: ubuntu-latest

    # Jalan setiap hari 17:00 UTC, tapi step di dalam cek hari Senin
    # Menggunakan schedule yang sama ('0 17 * * *') — pengecekan hari di step
    if: |
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 17 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.worker == 'all' ||
        github.event.inputs.worker == 'reset-weekly-challenges'
      ))

    steps:
      - name: Check if Monday (skip if not)
        id: check_day
        run: |
          # Untuk schedule: hanya jalankan di hari Senin (day of week = 1)
          # Untuk manual trigger: selalu lanjut
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date +%u)  # 1=Senin, 7=Minggu
            if [ "$DAY" != "1" ]; then
              echo "Bukan hari Senin (hari ini: $DAY), skip."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Hari Senin, lanjut cleanup."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Manual trigger, skip day check."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Invoke reset-weekly-challenges
        if: steps.check_day.outputs.skip != 'true'
        run: |
          echo "Calling reset-weekly-challenges..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ env.SUPABASE_URL }}/functions/v1/reset-weekly-challenges" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Status: $HTTP_CODE"
          echo "Response: $HTTP_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Worker failed with status $HTTP_CODE"
            exit 1
          fi

          DELETED=$(echo "$HTTP_BODY" | grep -o '"deleted":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "✅ Weekly challenges cleanup done. Deleted: $DELETED old rows"
